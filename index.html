<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xiaomi Unlock Tool</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0c13;
      --card-bg: #141622;
      --card-border: #23263b;
      --input-bg: #10121d;
      --cyan-main: #00d2df;
      --cyan-light: #5ce9f2;
      --cyan-dark: #009aa4;
      --cyan-soft-bg: rgba(0, 210, 223, 0.12);
      --text-main: #f1f3f9;
      --text-muted: #8b92a8;
      --terminal-bg: #090a0f;
      --terminal-green: #00e676;
      --terminal-cyan: #00e5ff;
      --terminal-yellow: #ffd600;
      --terminal-red: #ff5252;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding-bottom: 75px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Bar */
    .app-header {
      font-size: 19px;
      font-weight: 600;
      padding: 8px 4px 4px 4px;
      letter-spacing: 0.3px;
    }

    /* Common Card */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #e2e6f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-cyan {
      background: linear-gradient(135deg, var(--cyan-light), var(--cyan-dark));
      color: #051419;
      border: none;
      padding: 8px 14px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-cyan:active {
      opacity: 0.8;
    }

    /* Token Section & Multi-Tokens */
    .token-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-box {
      position: relative;
      background-color: var(--input-bg);
      border: 1px solid var(--cyan-dark);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
    }

    .input-box.inactive {
      border-color: var(--card-border);
      opacity: 0.6;
    }

    .input-box label {
      font-size: 11px;
      color: var(--cyan-main);
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 2px;
    }

    .input-box input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 12px;
      outline: none;
      font-family: 'JetBrains Mono', monospace;
    }

    .dual-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-outline {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      color: var(--cyan-main);
      padding: 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }

    .status-btn {
      background-color: var(--cyan-main);
      color: #05191d;
      border: none;
      border-radius: 14px;
      padding: 12px;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }

    .status-display {
      background-color: #bce9f5;
      color: #00363d;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    /* Beijing Time Card */
    .time-header-btn {
      background-color: rgba(0, 210, 223, 0.15);
      color: var(--cyan-light);
      border: 1px solid rgba(0, 210, 223, 0.3);
      border-radius: 16px;
      padding: 4px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .beijing-clock {
      text-align: center;
      font-size: 30px;
      font-weight: 700;
      color: var(--cyan-main);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.5px;
    }

    .countdown-text {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .network-stats {
      font-size: 11px;
      color: var(--cyan-light);
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 4px 6px;
    }

    /* Start Big Button */
    .btn-start-action {
      background: linear-gradient(90deg, #00d2df, #00b4d8);
      color: #031c22;
      border: none;
      border-radius: 18px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 210, 223, 0.3);
    }

    /* Terminal CMD */
    .terminal-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .terminal-actions {
      display: flex;
      gap: 12px;
    }

    .term-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .terminal-window {
      background-color: var(--terminal-bg);
      border-radius: 12px;
      padding: 12px;
      min-height: 190px;
      max-height: 250px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-line {
      word-break: break-all;
    }
    .log-cyan { color: var(--terminal-cyan); }
    .log-green { color: var(--terminal-green); }
    .log-yellow { color: var(--terminal-yellow); }
    .log-red { color: var(--terminal-red); }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background-color: rgba(14, 16, 24, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      max-width: 440px;
      margin: 0 auto;
      z-index: 10;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
    }

    .nav-item.active {
      background-color: rgba(0, 210, 223, 0.2);
      color: var(--cyan-light);
      padding: 6px 20px;
      border-radius: 20px;
    }

    /* Login Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tab-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .tab-btn {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px;
      border-radius: 10px;
      cursor: pointer;
    }

    .tab-btn.active {
      border-color: var(--cyan-main);
      color: var(--cyan-main);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="app-header">Xiaomi Unlock Tool</div>

    <!-- 1. Token Section (4 Auto Tokens) -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Xiaomi Service Token</span>
        <button class="btn-cyan" id="openLoginModal">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Log In to Account
        </button>
      </div>

      <div class="token-grid">
        <div class="input-box">
          <label>new_bbs_serviceToken #1 (Master)</label>
          <input type="text" id="token1" placeholder="Token 1 তৈরি হবে..." readonly>
        </div>
        <div class="input-box">
          <label>new_bbs_serviceToken #2 (Worker 2)</label>
          <input type="text" id="token2" placeholder="Token 2 তৈরি হবে..." readonly>
        </div>
        <div class="input-box">
          <label>new_bbs_serviceToken #3 (Worker 3)</label>
          <input type="text" id="token3" placeholder="Token 3 তৈরি হবে..." readonly>
        </div>
        <div class="input-box">
          <label>new_bbs_serviceToken #4 (Worker 4)</label>
          <input type="text" id="token4" placeholder="Token 4 তৈরি হবে..." readonly>
        </div>
      </div>

      <div class="dual-actions">
        <button class="btn-outline" id="btnCopyTokens">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
          Copy All
        </button>
        <button class="btn-outline" id="btnClearTokens">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Clear
        </button>
      </div>

      <button class="status-btn" id="btnCheckStatus">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        Check Status
      </button>

      <div class="status-display" id="accountStatusText">Not checked yet</div>
    </div>

    <!-- 2. Beijing Time Section -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Beijing Time (CST UTC+8)
        </span>
        <button class="time-header-btn" id="btnSyncNTP">Sync NTP</button>
      </div>

      <div class="beijing-clock" id="beijingClock">00:00:00.000</div>
      <div class="countdown-text" id="countdownTimer">Countdown to 00:00:00 00:00:00.000</div>

      <div class="network-stats">
        <div id="latencyRow">HTTP: 1034 ms | TCP: 129 ms</div>
        <div id="targetTriggerRow">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          Calculated trigger: 23:59:59.419 (Avg 581 ms)
        </div>
      </div>
    </div>

    <!-- 3. Big Start Trigger Button -->
    <button class="btn-start-action" id="btnStartApplication">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Start Application
    </button>

    <!-- 4. Execution Terminal / CMD -->
    <div class="terminal-card">
      <div class="terminal-header">
        <span class="card-title">Execution Log</span>
        <div class="terminal-actions">
          <button class="term-btn" id="btnCopyLog">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
            Copy
          </button>
          <button class="term-btn" id="btnClearLog">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
            Clear
          </button>
        </div>
      </div>
      <div class="terminal-window" id="terminalLog"></div>
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-nav">
    <button class="nav-item active">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Apply
    </button>
    <button class="nav-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Guide
    </button>
    <button class="nav-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </button>
  </div>

  <!-- Login Modal Dialog -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-box">
      <div class="card-header">
        <span class="card-title">Xiaomi Account Login</span>
        <span style="cursor:pointer; color:var(--text-muted);" id="closeModal">✕</span>
      </div>

      <div class="tab-row">
        <button class="tab-btn active" id="tabQR">QR Scan</button>
        <button class="tab-btn" id="tabID">ID / Pass</button>
      </div>

      <div id="qrSection" style="text-align: center; padding: 10px;">
        <div style="background: white; padding: 12px; display: inline-block; border-radius: 12px;">
          <svg width="150" height="150" viewBox="0 0 24 24"><path fill="#000" d="M2,2H10V10H2V2M4,4V8H8V4H4M14,2H22V10H14V2M16,4V8H20V4H16M2,14H10V22H2V14M4,16V20H8V16H4M18,14V18H22V14H18M14,14H16V16H14V14M14,18H16V22H14V18M18,20V22H22V20H18Z"/></svg>
        </div>
        <p style="font-size:11px; color:var(--text-muted); margin-top:8px;">Xiaomi Community / Mi Settings দিয়ে স্ক্যান করুন</p>
      </div>

      <div id="idSection" style="display:none; flex-direction:column; gap:10px;">
        <div class="input-box">
          <label>Xiaomi ID / Email / Phone</label>
          <input type="text" id="loginId" placeholder="1000847291">
        </div>
        <div class="input-box">
          <label>Password</label>
          <input type="password" id="loginPass" placeholder="••••••••">
        </div>
      </div>

      <button class="btn-start-action" style="padding: 12px;" id="btnExecuteLogin">লগইন ও ৪টি টোকেন তৈরি করুন</button>
    </div>
  </div>

  <script>
    // System State
    const tokens = ["", "", "", ""];
    let isTaskRunning = false;
    let ntpOffsetMs = 935;
    let avgLatencyMs = 581;

    // Terminal Logger
    function log(message, type = "cyan") {
      const term = document.getElementById("terminalLog");
      const line = document.createElement("div");
      line.className = `log-line log-${type}`;
      
      const now = new Date();
      const timeStr = `[${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}]`;
      line.textContent = `${timeStr} ${message}`;
      
      term.appendChild(line);
      term.scrollTop = term.scrollHeight;
    }

    // Beijing Clock & Millisecond Countdown
    function updateClock() {
      const now = new Date();
      const utcTime = now.getTime() + (now.getTimezoneOffset() * 60000);
      const beijingTime = new Date(utcTime + (3600000 * 8) + ntpOffsetMs);

      const h = String(beijingTime.getHours()).padStart(2, '0');
      const m = String(beijingTime.getMinutes()).padStart(2, '0');
      const s = String(beijingTime.getSeconds()).padStart(2, '0');
      const ms = String(beijingTime.getMilliseconds()).padStart(3, '0');

      document.getElementById("beijingClock").textContent = `${h}:${m}:${s}.${ms}`;

      const target = new Date(beijingTime);
      target.setHours(24, 0, 0, 0);
      let diff = target - beijingTime;
      if (diff < 0) diff += 86400000;

      const cdH = String(Math.floor(diff / 3600000)).padStart(2, '0');
      const cdM = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
      const cdS = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
      const cdMs = String(diff % 1000).padStart(3, '0');

      document.getElementById("countdownTimer").textContent = `Countdown to 00:00:00 ${cdH}:${cdM}:${cdS}.${cdMs}`;

      if (isTaskRunning && diff <= avgLatencyMs && diff > (avgLatencyMs - 40)) {
        fireConcurrentTokens();
      }
    }
    setInterval(updateClock, 30);

    // Initial Logs
    window.addEventListener("DOMContentLoaded", () => {
      log("Connecting to NTP server: time.google.com...", "cyan");
      log("Measuring latency to Xiaomi API...", "cyan");
      setTimeout(() => {
        log("NTP Synchronized! Beijing Time: 15:36:58.006 (Offset: 935 ms)", "green");
        log("Latency: HTTP: 1157 ms | TCP: 131 ms (Avg: 644 ms)", "cyan");
        log("Calculated trigger time: 23:59:59.356", "cyan");
      }, 700);
    });

    // Modal Control
    const modal = document.getElementById("loginModal");
    document.getElementById("openLoginModal").onclick = () => modal.style.display = "flex";
    document.getElementById("closeModal").onclick = () => modal.style.display = "none";

    document.getElementById("tabQR").onclick = function() {
      this.classList.add("active");
      document.getElementById("tabID").classList.remove("active");
      document.getElementById("qrSection").style.display = "block";
      document.getElementById("idSection").style.display = "none";
    };

    document.getElementById("tabID").onclick = function() {
      this.classList.add("active");
      document.getElementById("tabQR").classList.remove("active");
      document.getElementById("qrSection").style.display = "none";
      document.getElementById("idSection").style.display = "flex";
    };

    function generateRandomToken(index) {
      const chars = "abcdef0123456789";
      let token = `token_bbs_v2_slot${index}_`;
      for (let i = 0; i < 32; i++) {
        token += chars[Math.floor(Math.random() * chars.length)];
      }
      return token;
    }

    document.getElementById("btnExecuteLogin").onclick = () => {
      modal.style.display = "none";
      log("Authenticating with Xiaomi Server (China Region)...", "yellow");

      setTimeout(() => {
        for (let i = 0; i < 4; i++) {
          tokens[i] = generateRandomToken(i + 1);
          document.getElementById(`token${i + 1}`).value = tokens[i];
        }
        log("Account Authenticated successfully!", "green");
        log("Auto-generated 4 distinct new_bbs_serviceToken instances:", "green");
        tokens.forEach((t, idx) => log(`  -> Slot ${idx + 1}: ${t.substring(0, 22)}...`, "cyan"));
        
        document.getElementById("accountStatusText").textContent = "Account verified (China BBS Multi-Session Active)";
        document.getElementById("accountStatusText").style.background = "#c6f6d5";
        document.getElementById("accountStatusText").style.color = "#22543d";
      }, 1000);
    };

    // Clear and Copy
    document.getElementById("btnClearTokens").onclick = () => {
      for (let i = 0; i < 4; i++) {
        tokens[i] = "";
        document.getElementById(`token${i + 1}`).value = "";
      }
      document.getElementById("accountStatusText").textContent = "Not checked yet";
      document.getElementById("accountStatusText").style.background = "#bce9f5";
      document.getElementById("accountStatusText").style.color = "#00363d";
      log("Cleared all service tokens.", "yellow");
    };

    document.getElementById("btnCopyTokens").onclick = () => {
      const allTokens = tokens.filter(t => t).join("\n");
      if (!allTokens) return alert("কোনো টোকেন নেই!");
      navigator.clipboard.writeText(allTokens);
      log("All 4 tokens copied to clipboard.", "green");
    };

    document.getElementById("btnCheckStatus").onclick = () => {
      if (!tokens[0]) {
        alert("আগে লগইন করে টোকেন তৈরি করুন!");
        return;
      }
      log("Checking permission status for all 4 tokens...", "cyan");
      setTimeout(() => {
        log("Master Account Level: 5 (Eligible for Unlock Apply)", "green");
        log("Daily limit quota countdown active.", "cyan");
      }, 600);
    };

    // Terminal Controls
    document.getElementById("btnClearLog").onclick = () => document.getElementById("terminalLog").innerHTML = "";
    document.getElementById("btnCopyLog").onclick = () => {
      const text = document.getElementById("terminalLog").innerText;
      navigator.clipboard.writeText(text);
      alert("Execution Log Copied!");
    };

    // Multi-token Apply Engine
    function fireConcurrentTokens() {
      log(">>> TRIGGER ACTIVATED! Burst applying with 4 Workers <<<", "yellow");
      
      tokens.forEach((tok, index) => {
        const workerId = index + 1;
        const sendTime = new Date().toISOString().substring(11, 23);
        
        log(`[Worker #${workerId}] POST /apply/v2/bootloader with Token #${workerId} at ${sendTime}`, "cyan");

        setTimeout(() => {
          if (workerId === 2) {
            log(`[Worker #${workerId}] SUCCESS: 200 OK - Permission Granted! (Account Linked)`, "green");
            isTaskRunning = false;
            document.getElementById("btnStartApplication").style.background = "linear-gradient(90deg, #00d2df, #00b4d8)";
            document.getElementById("btnStartApplication").textContent = "⚡ Start Application";
          } else {
            log(`[Worker #${workerId}] Response: 429 / 10003 - Quota limit or redundant request handled.`, "red");
          }
        }, 120 + (index * 45));
      });
    }

    // Start Application Button
    document.getElementById("btnStartApplication").onclick = function() {
      if (!tokens[0]) {
        alert("দয়া করে আগে Login করে ৪টি টোকেন জেনারেট করুন!");
        return;
      }

      if (!isTaskRunning) {
        isTaskRunning = true;
        this.style.background = "linear-gradient(90deg, #ff5252, #d32f2f)";
        this.textContent = "⏹ Stop Application Loop";
        log("Multi-Threaded Apply Loop Armed and Waiting for Target Time (00:00:00 CST)...", "yellow");
        log("Tokens Loaded: 4 active concurrent workers configured.", "green");
      } else {
        isTaskRunning = false;
        this.style.background = "linear-gradient(90deg, #00d2df, #00b4d8)";
        this.textContent = "⚡ Start Application";
        log("Task Loop Cancelled by User.", "red");
      }
    };

    // Sync NTP manually
    document.getElementById("btnSyncNTP").onclick = () => {
      log("Querying NTP server time.pool.aliyun.com...", "cyan");
      setTimeout(() => {
        ntpOffsetMs = 942;
        avgLatencyMs = 490;
        document.getElementById("latencyRow").textContent = "HTTP: 980 ms | TCP: 110 ms";
        document.getElementById("targetTriggerRow").innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg> Calculated trigger: 23:59:59.510 (Avg 490 ms)`;
        log("NTP Resynced successfully. New Offset: 942 ms", "green");
      }, 500);
    };
  </script>
